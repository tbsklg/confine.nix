name = "config-test"
preset = "shell"
packages = ["coreutils", "python3Packages.pytest"]

[adapters.hello]
greeting = "moin"

[filesystem]
allowRead = ["~/notes"]

[define.adapters.greet]
package = "hello"

[[define.adapters.greet.capabilities]]
name = "as"
description = "Greet with a greeting"
params = [{ name = "greeting", kind = "string", description = "The greeting" }]
argv = ["--greeting", "{greeting}"]
