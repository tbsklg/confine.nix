name = "config-test"
preset = "shell"
packages = ["coreutils", "python3Packages.pytest", "greet"]

[adapters.hello]
greeting = "moin"

[filesystem]
allowRead = ["~/notes"]

[define.adapters.greet]
package = "hello"

[[define.adapters.greet.capabilities]]
name = "as"
description = "Greet with a greeting"
params = [{ name = "greeting", kind = "string", description = "The greeting" }]
argv = ["--greeting", "{greeting}"]

[define.adapters.echo]
package = "shout"

[[define.adapters.echo.capabilities]]
name = "say"
description = "Echo a text"
params = [{ name = "text", description = "The text" }]
argv = ["{text}"]
