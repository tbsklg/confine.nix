name: sandbox

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build the test env
        run: |
          nix build --impure --print-build-logs --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = "aarch64-darwin"; };
            in
            import ./nix/sandbox-test.nix { inherit pkgs; inherit (flake.lib) mkSandboxEnv; }'

      - name: Pass on the exit code
        run: |
          status=0
          "$GITHUB_WORKSPACE/result/bin/zandy-sandbox-test" --exit 3 || status=$?
          echo "zandy exited with $status, expected 3"
          test "$status" -eq 3

      - name: Plant canaries
        run: |
          mkdir -p ~/.aws ~/.ssh ~/.config/glab-cli
          printf '[default]\naws_access_key_id = AKIACANARY\n' > ~/.aws/credentials
          echo canary > ~/.ssh/id_canary
          printf 'hosts:\n  gitlab.com:\n    token: canary\n' > ~/.config/glab-cli/config.yml
          echo canary > ~/canary.txt

      - name: Probe the sandbox
        run: |
          project=$(mktemp -d)
          cd "$project"
          git init -q
          touch flake.nix .envrc
          CANARY_ENV=zandy-canary "$GITHUB_WORKSPACE/result/bin/zandy-sandbox-test"
